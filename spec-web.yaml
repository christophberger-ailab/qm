feature:
  name: web
  description: Serve a local web UI for sorting, editing, and rendering the project's pages

components:
  COMMAND:
    description: qm web [--addr <host:port>] [<path>]
    requirements:
      1: Object name is "web"
      2: No subcommand
      3: Parameters
      3-1: Flag --project sets the path to the document tree. Defaults to the current directory
      3-2: Flag --addr sets the listen address. Defaults to "localhost:8199"
      3-3: A positional path names the project to open and takes precedence over --project
      4: The command serves until it is interrupted, printing the URL it listens on to stderr

constraints:
  STANDARD: See the constraints in spec.yaml.

  ORIGIN:
    description: The command is the quarto-sorter tool (github.com/christophberger-ailab/quarto-sorter) merged into qm.
    requirements:
      1: The UI, its templates, and its static assets are embedded in the binary; no files are read from disk at run time
      2: The page tree, page editing, and the render panel keep the behavior they had in quarto-sorter
      3: The render panel and `qm render` drive the same flow (internal/bookrender), so both produce identical output

  UI:
    requirements:
      1: The page tree shows the project's .qmd pages in website order, nested by folder
      1-1: A page's title is its `title:` frontmatter, else the text of its first Markdown heading, else a title made from its file name
      1-2: A title taken from a heading drops the heading's own Pandoc attribute block, so `# PERLE OnCall-Schulungen {.unnumbered .unlisted}` shows as "PERLE OnCall-Schulungen"; a `{...}` directly after a `]` belongs to a bracketed span and is left to it
      1-3: A Quarto span in a title is shown as the symbol its class carries followed by the span's text, so `# [Polizei-]{.pol}[Feuerwehr-]{.fw}Spickzettel` shows as "🚔Polizei-🚒Feuerwehr-Spickzettel"
      1-4: The symbols are read from the `.quarto.<class>:before { content: "..." }` rules of the active custom preview stylesheet, so the tree and the preview mark a class alike and an edit to the stylesheet moves both; a span whose classes no rule names is shown as written
      2: Dragging a page updates the `order` frontmatter of the affected pages and the Markdown heading levels of the moved page
      2-1: A drag that moves a page to another parent renames its file on disk; if the page open in the editor is the moved one, or sits inside a moved section, the editor is re-pointed at the new path, so autosave keeps writing to the file instead of to a path that no longer exists
      2-2: The re-pointing replaces the editor's path, heading, and reload button only, never its text, which may hold edits that are not on disk yet; an autosave that the rename had already broken is retried at the new path
      3: Pages can be created, deleted, and edited in place
      3-0: A failed save is shown as an error next to the heading, naming why it failed, and leaving the page -- opening another one, reloading, closing the tab -- asks for confirmation while an edit is unsaved
      3-0-1: A save is replayed onto the writes the tree made to the same file since the editor opened it -- the `order:` a move or a create renumbered, and the heading levels a move to another depth shifted -- so an autosave after a move keeps both the user's text and the move
      3-0-2: An `order:` the user typed into the frontmatter themselves is kept over the one the tree wrote; a hand-made edit is never silently dropped
      3-0-3: A change to the file that the tree cannot account for -- an edit made outside the browser -- is answered as a conflict: the save is refused, the file is left as it is, and the user is offered the choice between reloading that version and overwriting it
      3-0-4: A replay is reported to the user, because the editor still shows the text from before it and only a reload brings the pane in line
      3-1: A Markdown preview of the edited page sits to the right of the editor, separated by a draggable divider
      3-2: The preview follows the editor's content as the user types
      3-3: A toggle button in the content header opens and closes the preview; the choice is remembered across sessions
      3-4: The preview is rendered in the browser from the embedded marked library; it approximates the page, it is not a Quarto render
      3-4-1: A heading is previewed without its own Pandoc attribute block -- `# PERLE OnCall-Schulungen {.unnumbered .unlisted}` reads "PERLE OnCall-Schulungen" -- because the attributes direct the render and are not part of what the heading says; a heading inside a code block is left as written
      3-5: The preview shows the page's images, served from the project by the `/media` route
      3-5-1: A website-absolute image path such as `/assets/images/x.png` resolves against the project root, the way the rendered site and the flattened book resolve it
      3-5-2: A relative image path resolves against the folder the edited page sits in
      3-5-3: The route serves image files only, and only from inside the open project
      3-5-4: An image standing alone in a paragraph -- a blank line before and after it -- is shown with its alt text as a caption below the image, the way Quarto renders such an image; an image inside a paragraph of text, and one without alt text, get no caption
      3-6: The editor is CodeMirror, embedded in the binary like the other assets, and highlights the page's YAML frontmatter and Markdown
      3-6-1: A toggle button in the editor's own column, above the editor text, switches Vim keybindings on and off; the choice is remembered across sessions
      3-6-2: Vim mode is off unless the user turns it on
      3-6-3: "`:w` saves the page immediately instead of waiting for the autosave delay"
      3-6-4: The textarea remains the field the edit form posts, so autosave and the preview are unaffected by the editor
      3-6-5: Typing a Markdown link's destination -- `[text](` or `![alt](`, whichever bracket opened it -- offers the entries of the directory named so far in a popup below the cursor; Up and Down move the selection, Tab or Enter inserts it, Esc closes the popup
      3-6-5-1: A destination starting with "/" completes against the project root; any other completes against the folder of the edited page, the same rule the preview's images resolve by
      3-6-5-2: "`![alt](` offers image files, `[text](` offers `.qmd` pages; a directory is offered either way, so the user can descend into it a level at a time"
      3-6-5-3: A completed destination containing a character that would otherwise end it -- a space above all -- is wrapped in Markdown's own `<...>` form; a destination that no longer needs the wrapping loses it again
      3-6-5-4: The segment being typed matches anywhere in a candidate's name, not only at its start; a candidate matching at the start is listed first
      3-7: The page open in the editor is remembered per project and reopened when the app page loads, so a restart, or a visit to the config pages and back, returns to the page the user was working on
      3-7-1: The reopened page is selected in the page tree, and collapsed branches above it are expanded
      3-7-2: A remembered page that is no longer there is forgotten, and the editor starts empty
      3-7-3: The remembered page is stored with the render selection in `<user config dir>/qm/render.json`
      3-7-4: The reopened page always shows that page's text on disk; the browser's own restore of form state across a reload -- which is where a restart ends -- never puts another page's text into the editor
      3-7-5: The editor opens with the page's text unchanged, a leading newline included, so an autosave writes back what was read
      4: The tree is polled for outside changes and refreshed when the project changed on disk
      5: The render panel selects a point in the project's three-axis matrix: topics, the audiences of each topic, and the output formats
      5-1: The selection is remembered per project in `<user config dir>/qm/render.json`
      5-2: The topics are the values of the project's `topic-*` profiles, the formats those of its `format-*` profiles
      5-3: For each topic, only the audiences the topic declares under `qm: audiences:` are offered or submitted for it; a topic that declares none offers every audience the project has
      5-4: A topic the user never configured defaults to every audience it takes part in
      5-5: A topic with two or more audiences shows them as checkboxes in the open, directly below the topic's own checkbox; every checked audience is one render run per checked format
      5-5-1: While the topic's own checkbox is unchecked its audience checkboxes are shown dimmed, since nothing is rendered for them; they stay usable, so the audiences can be chosen before the topic is checked
      5-6: A topic with exactly one audience shows no checkbox, but the form submits that audience through a hidden input
      6: A render runs in the background; the panel polls its log while it runs
      6-1: Only one render runs at a time
      6-2: The log follows its newest line as it grows; scrolling up stops it following and holds the position across the polls, until the user scrolls back to the bottom or starts another render
      7: The top bar shows a Config button at the far right
      7-1: The Config button opens a full config page whose entries are presented as a list that can grow
      7-2: 'The config list contains an entry named "Preview: Custom CSS" that opens the custom preview stylesheet editor'
      7-3: The custom preview stylesheet editor uses the embedded CodeMirror CSS mode, offers Save, and links back to the config page and the app
      7-4: Custom preview stylesheets are stored beside the render prefs as `<user config dir>/qm/custom-css/*.css`; the app ships a baked-in default that is materialized as `custom.css` the first time the app runs with a config directory that does not exist yet, and is never rewritten afterwards
      7-4-1: The editor lets the user add an alternate stylesheet by name and switch which one it is editing once more than one exists
      7-5: The app links the active custom preview stylesheet document-wide after `/static/app.css`, the route serves only the requested stored stylesheet as `text/css`, and an empty or absent stylesheet has no effect
      7-6: The editor tells the user to scope rules with `.markdown-preview` when they should affect only the preview
      7-7: When more than one custom CSS file exists, a dropdown above the Markdown preview lets the user switch which one is active; the choice is remembered across restarts and the preview reloads to apply the newly selected stylesheet
      8: A search field in the top bar searches the text of all pages of the open project
      8-1: The search is answered from a word index that is rebuilt in the background whenever the project changed on disk, so typing never waits for a scan of the project
      8-2: While the index is being built the field says so, and the query repeats itself until the index is ready
      8-3: A query term matches the words that start with it; a page matches when it matches every term of the query, case-insensitively
      8-3-1: Words are separated by whitespace, by punctuation of any script, and by every ASCII character that is not a letter or a digit, so that Markdown and YAML syntax never becomes part of a word; every other character belongs to a word, so a page is found by the characters it is written with in any script, symbols and emoji included
      8-3-2: A single hyphen between two word characters belongs to the word, so `semi-wide` is one word, found by `semi-wide` or `semi` but not by `wide`; a run of hyphens separates words as any other Markdown does
      8-3-3: A term of a single letter or digit is ignored, since it would match almost every page after the first keystroke; a single character that is neither is searched for
      8-3-4: Words between a pair of quotes -- single or double, typed or typographic -- are one term that matches only where those words stand next to each other in that order, and are searched for whatever their length
      8-3-5: A quotation mark that a word character precedes is an apostrophe, not the start of a phrase
      8-3-6: The last word of a phrase matches the words that start with it until the closing quote is typed and matches whole afterwards, so that a quoted query narrows down while it is typed and a closed one is the way to ask for whole words
      8-4: The index covers the same files as the page tree, so pages the tree does not show are not found either
      8-5: Pages with hits are highlighted in the page tree, each with its number of hits
      8-6: A collapsed branch that contains hits is shown open while the search is active, without changing the branch's remembered collapsed state
      8-7: The highlighting survives tree refreshes, page switches, and edits, and the query is remembered across sessions, so the results stay until the query changes
      8-8: The hits of the current query are highlighted in the editor as well, and opening a page scrolls its editor to the first hit
      9: The Open field in the top bar offers the projects opened before, most recent first
      9-1: The field itself shows only the last element of the open project's path, since the folder name is what tells one project from another; the full path is its tooltip and is what a submit opens
      9-2: A path typed or pasted into the field is opened as written, whatever the field showed before
      9-3: The dropdown holds the ten most recently opened projects, no project twice, and is remembered across restarts in `<user config dir>/qm/recent.json`
      9-4: A project opened from the command line counts as opened, so it is in the dropdown of the next session
      9-5: Opening a project updates the field and its dropdown along with the panes, the render panel, and the Git panel, all of which describe the project just opened
      10: A Git button to the right of the Render button opens a popup, like the render panel, that shows the changes since the last commit
      10-1: The changes are shown in two lists -- staged, which is what the next commit would carry, and not staged, which is what it would leave behind -- each entry with its porcelain status letters and the path; a file changed in both the index and the working tree appears in both lists
      10-2: Each entry can be staged or unstaged individually, and each list as a whole
      10-3: The panel commits the staged changes under a message the user types, and pushes the branch to its remote; a branch that tracks nothing yet is pushed with its upstream set
      10-4: Committing is offered only while something is staged, and a commit without a message is refused before git is called, since git would otherwise open an editor there is no terminal for
      10-5: The panel names the branch, its upstream, and how far the two have drifted apart
      10-6: What git said is shown as it stands -- the summary of a commit, the transcript of a push, the reason a hook or a remote refused
      10-7: A project that is not inside a Git working tree, and a machine without git installed, are told so instead of being offered operations that cannot run
      10-8: The status is read when the panel is opened and after every operation, never with the page, because a working tree changes under the app and a status read minutes ago is worse than none
      10-9: The operations run the `git` command, so the project's hooks, credential helpers, signing keys, and config apply as they do in a terminal; no prompt is issued, since no terminal is attached, and a call that outlasts the timeout is reported as such
      10-10: A click on a path in either list shows that file's diff in the panel, below the lists; the diff is for reading only, since the panel is where the changes are looked over and the editor is where they are made
      10-11: The diff shown is the one the list the click came from stands for -- what the next commit would carry, or what it would leave behind -- so a file changed in both places shows a different diff from each list
      10-12: An untracked file is diffed against an empty file, so the file the panel lists as new shows its whole content as added rather than nothing at all
      10-13: The diff pane names the file, says which of the two diffs it shows, counts the added and removed lines, and offers to open the file in the editor, which closes the panel and marks the page in the tree as the tree's own click would
      10-14: A file that is gone from the working tree, one git calls binary, and one that lies outside the open project are not offered to the editor, since there is nothing it could show
      10-15: Every operation clears the diff, because staging a file moves it to the other list, where its diff is a different one, and a diff left standing would be of a state that no longer exists
      10-16: The paths the panel sends back are checked against the open project the same way the editor's are, since a diff of an arbitrary path would otherwise read any file on the machine
