feature:
  name: qm
  description: This CLI tool manages quarto documentation. It adds functions that the `quarto` command lacks.

components:

  MAIN:
    description: Primary command behavior
    requirements:
      1: Command pattern is `qm <object> <subcommand> [<flag>|<parameter>]*`
      1-1: The first parameter is always an object 
      1-2: The second parameter is always a sub-command that applies to the object
      1-3: Subsequent parameters belong to the sub-command
      2: Implement subcommands as packages inside this module.
      2-1: Subcommands are specified in their respective specification file.
      2-2: Design a clean package API for each command.
      2-3: Wire up the subcommands in the main package. 
      2-4: The object parameter is not a subcommand. Don't use the object name as package name. Each object's subcommand gets its specific package.

constraints:

  SUBCOMMANDS:
    requirements:
      1: Use github.com/christophberger/start for managing subcommand setups and flags.
      2: The `start` module organizes commands and flags in a particular way.
      2-1: Flags may apply to qm as a whole or to specific subcommands. 
      2-2: Flags have corresponding environment variables and config file entries.
      3: The `start` module has no notion of `<object>`. Implement an object as a dummy command. 

  ORDERS:
    requirements:
      1: Files named index.qmd belong to their folder. Their order is in relation to sibling folders of their folder. So a/index.qmd and b/index.qmd belong to the same document level. Their order entry applies to this level.
      2: 'a/somemore.qmd and a/evenmore.qmd are sorted at the file level: a/index.qmd is always the first file in this order, and if a/somemore.qmd has order: 1, it follows after index.qmd, and if a/evenmore.qmd has order: 2, it follows after a/somemore.qmd in the chapters list.'

  BOOKS:
    requirements:
      1: Books are defined by profile yaml files
      2: 'The profile yaml files that define book chapters are named after existing document folders, with a `_quarto-` prefix and optional `-fw` and `-pol` suffixes. Example: For document folder `calltaker`, two profiles exist: `_quarto-calltaker-fw` and `_quarto-calltaker-pol`.'
      2-1: Subcommands may receive a profile name. E.g., profile name is "calltaker" -> profile yaml is `_quarto-calltaker.yml`
      2-2: A chapter list of a profile yaml of name "_quarto-a", "_quarto-a-fw" or "_quarto-a-pol" is generated from the folder "a" that must exist in the quarto document tree root.
      3: Source document file names may end in _POL.qmd or _FW.qmd.
      3-1: 'Source document folder names may end in _POL or _FW.'
      4: 'A chapter list in a profile yaml with -fw or -pol suffix is built with these rules:'
      4-1: If a file has no _POL or _FW suffix, include it as per the order value.
      4-2: If the basename of a folder or file has a _POL or _FW suffix, only include it if the suffix matches the suffix of the profile yaml file.
      5: If no particular profile name is passed in the command line, read all _quarto-<profile>.yml files and parse them for `book:` entries. Process each as described in the above BOOKS requirements.

  FILES:
    requirements:
      1: Files must have an order entry. Report files with a missing order entry but continue generating the chapters list.
      2: The paths to the chapters files in the profile yamls are relative to the Quarto document root.
      3: Exclude files whose names start with an underscore or a full stop. E.g., `_foo.qmd`, `.bar.qmd`.

  IMPLEMENTATION:
    requirements:
      1: The tool shall be implemented in Go.
      2: Write minimalistic code in idiomatic Go. 
      3: Keep external dependencies to an absolute minimum. The standard library provides useful packages for many requirements.
      4: Use red/green TDD.
