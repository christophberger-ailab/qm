feature:
  name: qm
  description: This CLI tool manages and renders a tree of Markdown documentation pages (.qmd or .md) into a website, DOCX and PDF, without Quarto or Pandoc.

components:

  MAIN:
    description: Primary command behavior
    requirements:
      1: Command pattern is `qm <object> <subcommand> [<flag>|<parameter>]*`
      1-1: The first parameter is always an object 
      1-2: The second parameter is always a sub-command that applies to the object
      1-3: Subsequent parameters belong to the sub-command
      2: Implement subcommands as packages inside this module.
      2-1: Subcommands are specified in their respective specification file.
      2-2: Design a clean package API for each command.
      2-3: Wire up the subcommands in the main package. 
      2-4: The object parameter is not a subcommand. Don't use the object name as package name. Each object's subcommand gets its specific package.

constraints:

  SUBCOMMANDS:
    requirements:
      1: Use github.com/christophberger/start for managing subcommand setups and flags.
      2: The `start` module organizes commands and flags in a particular way.
      2-1: Flags may apply to qm as a whole or to specific subcommands. 
      2-2: Flags have corresponding environment variables and config file entries.
      3: The `start` module has no notion of `<object>`. Implement an object as a dummy command. 

  ORDERS:
    requirements:
      1: Files named index.qmd belong to their folder. Their order is in relation to sibling folders of their folder. So a/index.qmd and b/index.qmd belong to the same document level. Their order entry applies to this level.
      2: 'a/somemore.qmd and a/evenmore.qmd are sorted at the file level: a/index.qmd is always the first file in this order, and if a/somemore.qmd has order: 1, it follows after index.qmd, and if a/evenmore.qmd has order: 2, it follows after a/somemore.qmd in the chapters list.'

  CONFIG:
    description: >
      A render is addressed along three orthogonal axes -- topic (what),
      format (how) and audience (for whom) -- all declared in one file,
      `qm.yml`. The earlier scheme of one Quarto profile file per axis value
      (`_quarto-<axis>-<value>.yml`) is no longer read; `qm migrate` converts
      it (see spec-migrate.yaml).
    requirements:
      1: 'The configuration is the file `qm.yml` in the project root. Unknown keys are errors'
      1-1: 'Its top-level keys are `title`, `lang`, `output` (default `_output`), `vars`, `formats`, `audiences` and `topics`; the three maps keep the order they are written in, and that order is the order of the matrix'
      2: 'A format has a `type` -- `html`, `docx`, `pdf`, or a list of `docx` and `pdf` -- and the optional keys `show`, `toc`, `template`, `dir`, `file`, `topics`, `audiences` and `vars`. `html` cannot be combined with another type; an unknown type is an error'
      2-1: 'A format without a `type` takes it from its name: docx, word, handout and handbook mean docx, pdf means pdf, anything else html'
      3: 'An audience has the optional keys `title`, `show` and `vars`'
      4: 'A topic has the optional keys `folder` (default the topic name), `title`, `cover`, `formats`, `audiences` and `vars`'
      5: 'A format, audience or topic named in a `formats`, `audiences` or `topics` list that the project does not define is an error'
      6: 'Without qm.yml every top-level content folder -- a directory not starting with `_` or `.` that holds a .qmd or .md file -- is a topic, the formats are `web` (html) and `docx`, and there is one audience, `all`'
      7: 'The old `_quarto.yml` and `_quarto-<axis>-<value>.yml` files are not read'
      8: '`{name}` placeholders in a format''s `dir`, `file` and `template` and a topic''s `cover` resolve against the variables: the project''s `vars`, then the topic''s, the audience''s and the format''s (later ones win), then the built-ins `topic`, `format` and `audience`. A placeholder without a variable is an error'
      9: 'The matrix is the cross product of topics, formats and audiences, cut down by what a topic and a format each declare under `formats`, `audiences` and `topics`; where both declare an axis, both have to agree'

  CONDITIONAL:
    description: >
      Content for one format or one audience is marked with a class on a
      fenced div or a bracketed span. The project's Lua filters no longer run.
    requirements:
      1: 'A class is a format class when a format lists it under `show`, and an audience class when an audience lists it under `show` or is named like it. Other classes are not conditional'
      2: 'A div or span with format classes is kept when the selected format shows one of them; one with audience classes is kept when the selected audience shows one of them; one with both kinds must pass both checks'
      3: 'A dropped div or span is removed with its content'
      4: '`.content-visible` and `.content-hidden` with `when-format` or `unless-format` compare against the format''s types and its name; conditions on profiles or metadata are not supported and the content is kept'
      5: 'A `::: slide` div and a `.notes` div are always dropped, since PPTX slide decks are not supported'

  BOOKS:
    description: >
      A topic's content folder is one document tree. Folder structure and
      `order:` front matter drive every output; a website and a document
      differ only in how the tree is written.
    requirements:
      1: 'Headings are demoted by folder depth: pages in the topic folder, and the `index.qmd` of a subfolder (which sorts among its parent''s pages), keep their headings as written, and each deeper folder level adds one level'
      1-1: 'A page whose front-matter title is not spelled out by a heading at its top heading level gets a generated title heading, and its own headings stay below it'
      2: 'A document is the topic''s folder flattened into one Markdown text (the text `qm flatten` writes), with in-book links turned into anchors and shortcodes resolved, then parsed in Go'
      3: Source document file names may end in _POL.qmd or _FW.qmd.
      3-1: 'Source document folder names may end in _POL or _FW.'
      4: The audience decides which of a folder's variant files are in play.
      4-1: If a file has no _POL or _FW suffix, include it as per the order value.
      4-2: If the basename of a folder or file has a _POL or _FW suffix, only include it if the suffix matches the selected audience.
      4-3: 'Variant content is wrapped in a `::: pol` / `::: fw` div, which is conditional like any other'

  MARKDOWN:
    description: Markdown is parsed in Go, not by Pandoc.
    requirements:
      1: 'The parser is goldmark with fenced divs, bracketed spans, heading, link and image attributes, callouts, footnotes, GFM tables and definition lists'
      2: 'The shortcodes `include`, `var` and `pagebreak` are resolved by qm on the text before it is parsed; `{{< var >}}` reads `_variables.yml` and the selection''s variables; any other shortcode is reported and left as written'

  FILES:
    requirements:
      1: Files must have an order entry. Report files with a missing order entry but continue.
      2: The paths in qm.yml (`folder`, `cover`, `template`) are relative to the project root.
      3: Exclude files whose names start with an underscore or a full stop. E.g., `_foo.qmd`, `.bar.qmd`.

  IMPLEMENTATION:
    requirements:
      1: The tool shall be implemented in Go.
      2: Write minimalistic code in idiomatic Go. 
      3: Keep external dependencies to an absolute minimum. The standard library provides useful packages for many requirements.
      4: Use red/green TDD.

  EXITCODE:
    description: >
      Scripts and CI tell a failed render from a good one by the exit status.
    requirements:
      1: A failing subcommand exits with a non-zero status
      1-1: github.com/christophberger/start prints a command's error and returns from Up() without setting an exit status, so every registered command is wrapped (internal/cli) and main() exits after Up()
      1-2: 'Without this, a failed render would look like a good one to a script or CI'
