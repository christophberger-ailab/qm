feature:
  name: qm
  description: This CLI tool manages quarto documentation. It adds functions that the `quarto` command lacks.

components:

  MAIN:
    description: Primary command behavior
    requirements:
      1: Command pattern is `qm <object> <subcommand> [<flag>|<parameter>]*`
      1-1: The first parameter is always an object 
      1-2: The second parameter is always a sub-command that applies to the object
      1-3: Subsequent parameters belong to the sub-command
      2: Implement subcommands as packages inside this module.
      2-1: Subcommands are specified in their respective specification file.
      2-2: Design a clean package API for each command.
      2-3: Wire up the subcommands in the main package. 
      2-4: The object parameter is not a subcommand. Don't use the object name as package name. Each object's subcommand gets its specific package.

constraints:

  SUBCOMMANDS:
    requirements:
      1: Use github.com/christophberger/start for managing subcommand setups and flags.
      2: The `start` module organizes commands and flags in a particular way.
      2-1: Flags may apply to qm as a whole or to specific subcommands. 
      2-2: Flags have corresponding environment variables and config file entries.
      3: The `start` module has no notion of `<object>`. Implement an object as a dummy command. 

  ORDERS:
    requirements:
      1: Files named index.qmd belong to their folder. Their order is in relation to sibling folders of their folder. So a/index.qmd and b/index.qmd belong to the same document level. Their order entry applies to this level.
      2: 'a/somemore.qmd and a/evenmore.qmd are sorted at the file level: a/index.qmd is always the first file in this order, and if a/somemore.qmd has order: 1, it follows after index.qmd, and if a/evenmore.qmd has order: 2, it follows after a/somemore.qmd in the chapters list.'

  PROFILES:
    description: >
      A render is addressed along three orthogonal axes, each of them a
      Quarto profile of its own. This replaces the earlier scheme in which
      one profile name carried both the book and the agency variant
      (`_quarto-calltaker-fw`), which could compose an output path from two
      of the three axes at most.
    requirements:
      1: 'The axes are `topic`, `format`, and `audience`. A profile is named `_quarto-<axis>-<value>.yml`.'
      1-1: 'topic selects what is rendered: the content folder.'
      1-2: 'format selects how it is rendered: the project type, the output directory, and the output formats.'
      1-3: 'audience selects who it is for: the `make.*` flags the content filter reads.'
      2: 'A render selection is exactly one profile per axis: `quarto render --profile topic-<t>,format-<f>,audience-<a>`.'
      2-1: The profiles are passed in axis order. Quarto merges profiles left to right and the first-listed one wins for scalar keys, so the format must precede the audience for a book's output directory to come from the format.
      2-2: Two profiles on one axis, a missing axis, or a profile with no file are errors.
      3: 'The topic `none` selects no content folder; it is what a website render uses.'
      4: 'A topic profile declares the axes it takes part in, under `qm: formats:` and `qm: audiences:`. Declaring nothing means every value the project offers.'
      5: 'A topic profile may name its content folder under `qm: folder:`; the default is the topic name.'
      6: 'Output paths are composed from `_quarto-vars` shared by the profiles. Quarto resolves `{{< var >}}` in `book: output-file` and `book: title` only; everything else that has to vary along two axes is declared under `qm:` and carried out by `qm prepare` and `qm finalize`.'

  BOOKS:
    description: >
      A book is a topic's content folder flattened into one document, not a
      list of chapter files. Quarto books are flat — one file per chapter,
      folder depth carries no meaning — so a multi-level folder cannot be
      expressed as a chapter list at all.
    requirements:
      1: 'The chapter list is a fixed one-element list in _quarto.yml: `book: chapters: [index.qmd]`. Nothing generates it.'
      1-1: A profile must not set `book: chapters:`. Quarto concatenates array keys across configurations instead of replacing them, so a second list is added to the first.
      2: 'The topic''s folder is flattened into `_build/book.qmd`, which index.qmd includes; its slide divs go into `_build/slides.qmd`.'
      2-1: 'The build documents live in an underscore-prefixed *directory*, not under underscore-prefixed *names*: the directory keeps Quarto''s website scan out, whereas the name would also exclude the file from the project inputs, and Quarto honours output-dir and output-file only for project inputs.'
      2-2: The names are fixed, so index.qmd needs one topic-independent include and the topic is selected by the profile alone.
      2-3: 'A stub `_build/book.qmd` is committed: Quarto expands the include while it builds the project context, which is before the pre-render hook runs.'
      3: Source document file names may end in _POL.qmd or _FW.qmd.
      3-1: 'Source document folder names may end in _POL or _FW.'
      4: The audience decides which of a folder's variant files are in play.
      4-1: If a file has no _POL or _FW suffix, include it as per the order value.
      4-2: If the basename of a folder or file has a _POL or _FW suffix, only include it if the suffix matches the selected audience.

  FILES:
    requirements:
      1: Files must have an order entry. Report files with a missing order entry but continue.
      2: The paths to the chapters files in the profile yamls are relative to the Quarto document root.
      3: Exclude files whose names start with an underscore or a full stop. E.g., `_foo.qmd`, `.bar.qmd`.

  IMPLEMENTATION:
    requirements:
      1: The tool shall be implemented in Go.
      2: Write minimalistic code in idiomatic Go. 
      3: Keep external dependencies to an absolute minimum. The standard library provides useful packages for many requirements.
      4: Use red/green TDD.

  EXITCODE:
    description: >
      qm is wired into the project as Quarto's pre- and post-render hook, and
      Quarto decides whether to abort a render by the hook's exit status.
    requirements:
      1: A failing subcommand exits with a non-zero status
      1-1: github.com/christophberger/start prints a command's error and returns from Up() without setting an exit status, so every registered command is wrapped (internal/cli) and main() exits after Up()
      1-2: 'Without this, a rejected profile selection lets the render continue on whatever `_build/` still holds — the previous topic''s content under the new selection''s name'
