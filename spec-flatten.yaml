feature:
  name: flatten
  description: Write the Markdown a document render of one topic parses, without rendering

components:
  COMMAND:
    description: qm flatten <topic>
    requirements:
      1: Object name is "flatten"
      2: No subcommand
      3: Flag --project sets the path to the document tree. Defaults to the current directory
      4: One positional argument names the topic. Required

constraints:
  STANDARD: See the constraints in spec.yaml.

  PROCESS:
    requirements:
      1: Use the same flattening behavior as a document render (internal/build): pages in folder order, headings demoted by folder depth, in-book links turned into anchors, shortcodes resolved
      2: Write `_build/<topic>.md`, the text a document render parses
      3: The content folder is the topic's `folder` in qm.yml, or the topic name
      4: A topic that qm.yml (or, without it, the content folders) does not define is an error, and nothing is written
      5: Conditional content is not filtered; that is a render's job, since it depends on the format and audience
      6: Keep the generated file and exit
