feature:
  name: chapters-update
  description: This qm subcommand reads order values from quarto metadata to generate or update chapters lists.

components:
  COMMAND:
    description: qm chapters update
    requirements:
      1: Object name is "chapters"
      2: Subcommand name is "update"
      3: Flags and parameters
      3-1: "Flag `--project`: The path to the document tree. Defaults to the current directory"
      3-2: The name of the book yaml to update. Defaults to all profile yamls that contain a `book:` entry.
      4: Recursively read the order entries from the yaml frontmatter of each *.md or *.qmd file and save each file path and its order so that you can produce an ordered list of chapters later
      5: "Open the Quarto profile yaml file and find the entry 'book: chapters:'."
      6: Add the list of chapters in the appropriate order, based on the given constraints.

constraints:
  STANDARD: See the constraints in spec.yaml.

examples:

  SYSADMIN:
    1: Command `qm chapters update sysadmin`
    2: Resulting Quarto profile file is `_quarto-sysadmin.yml`
    3: Resulting book folder is `sysadmin/`
  
  EINFUEHRUNG:
    1: Current working dir is outside the Quarto project
    2: Command `qm update einfuehrung --project $HOME/docs/training`
    3: Resulting Quarto profile file is `_quarto-einfuehrung.yml`
    4: Resulting book folder is `$HOME/docs/training/einfuehrung/`